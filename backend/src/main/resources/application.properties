spring.application.name=floreevent
server.port=${PORT:8080}

# Profil actif : "dev" par defaut (H2 en memoire), "prod" en production (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
# Le schema est cree par les migrations Flyway ; Hibernate verifie seulement qu il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate

# Adresse du site : CORS et liens envoyes par email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT : en production, JWT_SECRET doit etre une cle longue et secrete (32 caracteres minimum)
app.jwt.secret=${JWT_SECRET:dev-secret-a-remplacer-en-production-0123456789}
# Jeton valable 12 heures : une journee de travail
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# Compte du gerant, cree au demarrage s il n existe pas (valeurs saisies chez l hebergeur en production)
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}

# Regles de prix (hypotheses du cahier des charges, a confirmer par FloreEvent) ; montants en centimes TTC
app.pricing.extra-day-percent=50
# Zones de livraison depuis Melun : distance maximale en km et prix
app.pricing.delivery-zones=15:4000,30:7000,50:11000
app.pricing.deposit-percent=30
app.pricing.security-deposit-percent=30
app.pricing.min-security-deposit-cents=15000
# Entrepot de FloreEvent (Melun) : point de depart des livraisons
app.depot.latitude=48.53618
app.depot.longitude=2.658187

# Devis : le client l accepte et paie l acompte dans ce delai (jours)
app.quote.validity-days=7
# Annulation d une reservation confirmee : plus de 30 jours avant, acompte rembourse ; de 30 a 8 jours, acompte conserve ;
# moins de 8 jours, ce pourcentage du total reste du
app.cancellation.full-refund-days=30
app.cancellation.deposit-kept-days=8
app.cancellation.late-percent=50

# Paiement de l acompte par carte : Stripe en mode test (cles saisies chez l hebergeur, jamais dans le code)
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Sans cle Stripe : paiement simule (aucun argent echange), pour le developpement et la demonstration
app.payments.simulation=${PAYMENT_SIMULATION:false}

# Coordonnees imprimees sur les devis et factures (a completer par FloreEvent)
app.company.name=${COMPANY_NAME:FloreEvent}
app.company.address=${COMPANY_ADDRESS:Melun (77000)}
app.company.phone=${COMPANY_PHONE:+33 6 68 98 88 53}
app.company.email=${COMPANY_EMAIL:contact@floreevent.fr}
app.company.siret=${COMPANY_SIRET:}

# Emails (Brevo) : sans cle, les emails sont ecrits dans le journal du serveur
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.sender-email=${MAIL_SENDER_EMAIL:no-reply@floreevent.local}
app.mail.sender-name=${MAIL_SENDER_NAME:FloreEvent}
# Lien « mot de passe oublie » valable 60 minutes
app.password-reset.minutes=60
# Rappel envoye aux clients 2 jours avant l evenement, chaque matin a 8 h (heure de Paris)
app.reminder.days-before=2
app.reminder.cron=0 0 8 * * *

# Demonstration (portfolio) : donnees fictives et comptes publics. false pour la vraie entreprise.
app.demo.enabled=${APP_DEMO:false}
app.demo.photos=${APP_DEMO_PHOTOS:true}
