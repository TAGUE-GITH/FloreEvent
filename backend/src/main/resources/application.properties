spring.application.name=floreevent
server.port=${PORT:8080}

# Profil actif : "dev" par defaut (H2 en memoire), "prod" en production (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
# Le schema est cree par les migrations Flyway ; Hibernate verifie seulement qu il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate

# Adresse du site : CORS et liens envoyes par email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
