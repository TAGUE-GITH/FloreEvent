# Base H2 en memoire (mode PostgreSQL) : aucune installation necessaire en local
spring.datasource.url=jdbc:h2:mem:floreevent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Compte gerant de developpement (local uniquement)
app.bootstrap.email=gerant@floreevent.test
app.bootstrap.password=floreevent-dev-2026

# Paiement de l acompte simule tant qu aucune cle Stripe n est renseignee
app.payments.simulation=true
