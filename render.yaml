# Service de l'API sur Render (offre gratuite), construit avec backend/Dockerfile.
# Les valeurs secretes (sync: false) se saisissent dans le tableau de bord de Render, jamais dans le code.
services:
  - type: web
    name: floreevent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Cle aleatoire generee par Render
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Compte du proprietaire (gerant) : cree au demarrage s'il n'existe pas. Supprimer BOOTSTRAP_PASSWORD ensuite.
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      # Adresse qui recoit les messages du formulaire de contact
      - key: COMPANY_EMAIL
        sync: false
      # Vraie entreprise : pas de donnees fictives ni de comptes d'essai (true seulement pour une demonstration)
      - key: APP_DEMO
        value: "false"
      # Pas de paiement simule : sans cle Stripe, l'acompte se regle hors ligne (virement, cheque, especes)
      - key: PAYMENT_SIMULATION
        value: "false"
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SENDER_EMAIL
        sync: false
      # Facultatif : Stripe en mode test (sk_test_... et whsec_...)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
