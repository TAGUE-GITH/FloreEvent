# Environnement complet (API + PostgreSQL) : docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: floreevent
      POSTGRES_USER: floreevent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floreevent}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U floreevent -d floreevent']
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/floreevent
      DATABASE_USERNAME: floreevent
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-floreevent}
      FRONTEND_URL: http://localhost:5173
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
