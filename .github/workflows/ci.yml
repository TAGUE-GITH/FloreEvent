name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21, Spring Boot, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: floreevent
          POSTGRES_USER: floreevent
          POSTGRES_PASSWORD: floreevent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U floreevent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Les tests tournent sur une vraie base PostgreSQL, comme en production
    env:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://localhost:5432/floreevent
      DATABASE_USERNAME: floreevent
      DATABASE_PASSWORD: floreevent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      # En cas d'echec : chaque test rate apparait directement dans le resume de GitHub (annotations)
      - name: Signaler les tests en echec
        if: failure()
        run: |
          for report in target/surefire-reports/*.txt; do
            if grep -q "FAILURE" "$report"; then
              summary=$(grep -m4 -E "FAILURE|Exception|expected" "$report" | tr '\n' ' ' | cut -c1-900)
              echo "::error title=Test en echec::$summary"
            fi
          done

  frontend:
    name: Frontend (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
